spring.application.name=movie-service
server.port=8082

spring.datasource.url=${MOVIE_DATABASE_URL:jdbc:mysql://localhost:3306/movie_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:cinema}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# PHẢI GIỐNG HỆT ở mọi service, dài ít nhất 32 ký tự
jwt.secret=${JWT_SECRET}

cinema.zone-id=${CINEMA_ZONE_ID:Asia/Ho_Chi_Minh}

cinema.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# Địa chỉ venue-service và cấu hình timeout/retry
services.venue.url=${VENUE_SERVICE_URL:http://localhost:8083}
services.timeout.connect-ms=${SERVICE_CONNECT_TIMEOUT_MS:2000}
services.timeout.read-ms=${SERVICE_READ_TIMEOUT_MS:3000}
services.retry.max-attempts=${SERVICE_RETRY_ATTEMPTS:3}
services.retry.backoff-ms=${SERVICE_RETRY_BACKOFF_MS:200}

